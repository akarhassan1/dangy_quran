name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS Large Files
        run: git lfs pull

      - name: Extract Project Zip
        run: |
          if [ -f "Dangy_Quran_iOS_v5.1_Project.zip" ]; then
            echo "Extracting Dangy_Quran_iOS_v5.1_Project.zip..."
            unzip -o Dangy_Quran_iOS_v5.1_Project.zip
          fi
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Native Archive (.app)
        working-directory: ios/App
        run: |
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package App into Sideloadable IPA
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find ios/App/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
          fi
          echo "Found compiled .app bundle at: $APP_PATH"
          cp -r "$APP_PATH" build-output/Payload/
          cd build-output
          zip -r -9 ../Dangy_Quran_App_v5.1.ipa Payload
          cd ..
          echo "IPA Created Successfully!"
          ls -lh Dangy_Quran_App_v5.1.ipa

      - name: Upload IPA Artifact (Ready for Sideloadly)
        uses: actions/upload-artifact@v4
        with:
          name: Dangy_Quran_App_v5.1_iOS_IPA
          path: Dangy_Quran_App_v5.1.ipa
          retention-days: 14
