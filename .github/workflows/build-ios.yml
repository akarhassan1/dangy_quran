name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS Large Files
        run: git lfs pull

      - name: Extract Project Zip with Path Normalizer
        run: |
          python3 - << 'EOF'
          import zipfile, os

          zip_file = "Dangy_Quran_iOS_v5.1_Project.zip"
          if os.path.exists(zip_file):
              print(f"Extracting {zip_file} with POSIX path normalization...")
              with zipfile.ZipFile(zip_file, "r") as z:
                  for info in z.infolist():
                      clean_name = info.filename.replace('\\', '/').lstrip('/')
                      if not clean_name:
                          continue
                      if info.is_dir() or clean_name.endswith('/'):
                          os.makedirs(clean_name, exist_ok=True)
                      else:
                          parent = os.path.dirname(clean_name)
                          if parent:
                              os.makedirs(parent, exist_ok=True)
                          with open(clean_name, "wb") as f:
                              f.write(z.read(info))
              print("Extraction completed successfully!")
          EOF
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps || npm install --force

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Compile iOS Native Binary (.app)
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package App into IPA for Sideloadly
        run: |
          mkdir -p build-output/Payload
          APP_DIR=$(find ios/App -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
          fi
          echo "Found compiled app at: $APP_DIR"
          cp -r "$APP_DIR" build-output/Payload/
          cd build-output
          zip -r -9 ../Dangy_Quran_App_v5.1.ipa Payload
          cd ..
          echo "IPA Size:"
          ls -lh Dangy_Quran_App_v5.1.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dangy_Quran_App_v5.1_iOS_IPA
          path: Dangy_Quran_App_v5.1.ipa
          retention-days: 14
